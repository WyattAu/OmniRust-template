# docs.rs carries published docs; this job previews workspace docs on Pages.
name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --no-deps --all-features
      - run: echo '<meta http-equiv="refresh" content="0; url=omni_core/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

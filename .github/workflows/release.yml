# release-plz flow: PR bumping versions + CHANGELOG on every push to main;
# on merge, publish to crates.io with the vet + semver gates upstream.
# Required secret: RELEASE_PLZ_TOKEN (PAT with repo + crates.io rights).
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz-pr:
    name: release-plz (PR)
    runs-on: ubuntu-latest
    # Armed via repo *variable* RELEASE_PLZ_ENABLED=true (+ secrets).
    # Fresh templates without tokens stay green (skipped) instead of red.
    if: ${{ github.repository_owner == 'WyattAu' && vars.RELEASE_PLZ_ENABLED == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-release:
    name: release-plz (publish)
    runs-on: ubuntu-latest
    # Armed via repo *variable* RELEASE_PLZ_ENABLED=true (+ secrets).
    # Fresh templates without tokens stay green (skipped) instead of red.
    if: ${{ github.repository_owner == 'WyattAu' && vars.RELEASE_PLZ_ENABLED == 'true' }}
    permissions:
      contents: write
      # SLSA build provenance for the published artifacts (loop 35): the
      # attestation is bound to this workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: attest published crates
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: target/package/*.crate

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # SBOM of the dependency graph ships with the release (research note 40).
      - name: generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
